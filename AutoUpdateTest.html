<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自動更新テスト</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    main { max-width: 600px; margin: 0; padding: 0; }
    .card { background: #fff; border-radius: 12px; padding: 2rem; text-align: center; box-shadow: var(--shadow); }
    .card-label { font-weight: bold; margin-bottom: .5rem; }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <script src="assets/site.js"></script>

  <div class="content">
  <div class="page-head">
    <h1 class="page-title" id="pageTitle">AutoUpdateTest<span class="page-subtitle">2秒後の自動画面遷移</span></h1>
  </div>

  <p class="page-explain">このページは開くと2秒後にホーム画面に遷移します。</p>

  <main>
    <div class="card">
      <div class="card-label">表示内容</div>
      <div id="displayText">読み込み中…</div>
    </div>
  </main>

  <script>
    // ページ読み込み後2秒でホーム画面へ遷移
    setTimeout(() => {
      window.location.href = "index.html";
    }, 2000);
  </script>
  </div>
</div>
</body>
</html>
