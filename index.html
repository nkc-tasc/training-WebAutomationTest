<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ホームページ</title>
  <link rel="stylesheet" href="assets/common.css">
  <style>
    .hero {
      background: linear-gradient(120deg, #273c75, #3f6fd1);
      color: #fff;
      padding: 32px 40px;
    }
    .hero .page-title {
      margin: 0;
      font-size: 28px;
      max-width: 1180px;
      margin: 0 auto;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 40px 40px;
    }
    .category-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 24px 0 10px;
      font-size: 16px;
    }
    .category-title::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 3px;
      background: var(--cat-color);
    }
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 14px;
    }
    .card {
      position: relative;
      background: #fff;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: var(--shadow);
      border-top: 4px solid var(--cat-color);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12);
    }
    .card a {
      color: var(--primary);
      font-weight: bold;
      font-size: 16px;
      text-decoration: none;
      word-break: break-all;
    }
    /* カード全体をクリック可能にする */
    .card a::after {
      content: "";
      position: absolute;
      inset: 0;
    }
    .card-desc {
      margin: 6px 0 0;
      font-size: 13px;
      color: var(--muted);
    }
    @media (max-width: 600px) {
      .hero { padding: 24px 16px; }
      .wrap { padding: 8px 16px 32px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1 class="page-title" id="pageTitle">テスト自動化 練習サイト</h1>
  </header>

  <main class="wrap">
    <!-- カードは assets/site.js のページ一覧から生成されます -->
    <div id="indexCards"></div>
  </main>

  <script src="assets/site.js"></script>
</body>
</html>
